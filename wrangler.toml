name = "forge-agent-api"
main = "worker/index.ts"
compatibility_date = "2026-09-25"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
# Set this to the deployed app origin, comma-separated for multiple origins.
ALLOWED_ORIGINS = ""

[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "forge-agent-artifacts"

[[d1_databases]]
binding = "DB"
database_name = "forge-agent"
database_id = "REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID"
migrations_dir = "migrations"

[assets]
directory = "dist"

[observability]
enabled = true
